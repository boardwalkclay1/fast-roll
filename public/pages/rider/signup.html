<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rider Signup — The Fast Roll</title>

    <link rel="icon" type="image/png" href="/img/Fast-logo.png" />
    <link rel="stylesheet" href="/css/style.css" />

    <style>
        body {
            background: url('/img/fast-longboard.jpg') center/115% no-repeat fixed;
            background-color: #05060a;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.75));
            z-index: -1;
        }
        .corner-photo {
            position: fixed;
            bottom: 18px;
            right: 18px;
            width: 200px;
            opacity: 0.9;
            cursor: pointer;
            z-index: 9998;
            transition: transform 0.25s ease;
        }
    </style>
</head>

<body>

<nav class="nav">
    <div class="logo">
        <img src="/img/Fast-logo.png" class="logo-img" alt="The Fast Roll Logo" />
    </div>
    <div class="nav-links">
        <a href="/index.html#how">How It Works</a>
        <a href="/index.html#order">Order</a>
        <a href="/index.html#riders">Riders</a>
    </div>
</nav>

<div class="form-wrapper" style="margin-top:140px;">
    <h1>Become a Rider</h1>
    <p>Roll the Beltline and get paid instantly after each delivery.</p>

    <form id="riderSignupForm">

        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" required />
        </div>

        <div class="form-group">
            <label>Vehicle</label>
            <select id="vehicle">
                <option value="longboard">Longboard</option>
                <option value="inlines">Inline Skates</option>
                <option value="skateboard">Skateboard</option>
                <option value="escooter">E‑Scooter</option>
                <option value="ebike">E‑Bike</option>
                <option value="onewheel">OneWheel</option>
            </select>
        </div>

        <div class="form-group">
            <label>PayPal Email</label>
            <input type="email" id="paypal" required />
            <a href="https://www.paypal.com/signup" target="_blank" style="color:#ffcc00; font-size:13px; display:block; margin-top:6px;">
                Don’t have PayPal? Create an account here.
            </a>
        </div>

        <div class="form-group">
            <button type="button" id="sendCodeBtn" class="secondary-btn">Send Verification Code</button>
        </div>

        <div class="form-group">
            <label>Verification Code</label>
            <input type="text" id="paypalCode" placeholder="Enter the 6‑digit code" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required />
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm" required />
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="terms" />
                I agree that I ride at my own risk and The Fast Roll is not liable.
            </label>
        </div>

        <button class="primary-btn" type="submit">Create Rider Account</button>
    </form>
</div>

<!-- SCOOT MASCOT -->
<img src="/img/fast-board-transparent.jpg" class="corner-photo" alt="Scoot Mascot" />

<script src="/js/mascot.js"></script>
<script src="/js/riderSignup.js"></script>

</body>
</html>
