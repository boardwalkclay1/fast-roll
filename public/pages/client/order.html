<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Order — The Fast Roll</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/Fast-logo.png" />

    <!-- Social Preview -->
    <meta property="og:title" content="Start a Beltline Delivery — The Fast Roll" />
    <meta property="og:description" content="Order a Beltline delivery from skaters, longboarders, e‑bikes, scooters & OneWheels." />
    <meta property="og:image" content="/img/fast-index.jpg" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Start a Beltline Delivery — The Fast Roll" />
    <meta name="twitter:description" content="Fast Beltline-native delivery by riders on wheels." />
    <meta name="twitter:image" content="/img/fast-index.jpg" />

    <link rel="stylesheet" href="/css/style.css" />

    <style>
        /* BLUE BACKGROUND */
        body {
            background: #0d1b3d; /* deep cinematic blue */
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* HUGE SCOOTER LOGO */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("/img/fast-scooter-logo.jpg");
            background-repeat: no-repeat;
            background-size: 320%; /* 4× bigger */
            background-position: center -10%; /* lifted upward */
            opacity: 0.28; /* NOT pale, but still behind content */
            z-index: -1;
            pointer-events: none;
        }

        /* FORM WRAPPER — no washed-out white */
        .form-wrapper {
            background: rgba(255, 255, 255, 0.12); /* subtle glass */
            backdrop-filter: blur(4px);
            padding: 32px;
            border-radius: 14px;
            max-width: 520px;
            margin: 100px auto;
            color: #fff;
        }

        .form-wrapper h1,
        .form-wrapper p,
        label {
            color: #fff;
        }

        input, textarea, select {
            background: rgba(255, 255, 255, 0.85);
            border: none;
            padding: 10px;
            border-radius: 8px;
        }

        .primary-btn {
            background: #ffcc00;
            color: #000;
            font-weight: bold;
        }

        nav.nav {
            background: transparent;
            color: #fff;
        }

        nav.nav .logo {
            color: #fff;
            font-weight: bold;
        }

        nav.nav a {
            color: #ffcc00;
        }
    </style>
</head>

<body>

    <nav class="nav">
        <div class="logo">THE FAST ROLL</div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
        </div>
    </nav>

    <main class="form-wrapper">
        <h1>Start Your Delivery</h1>
        <p>Tell us what you bought and where you want it delivered.</p>

        <form id="orderForm">

            <div class="form-group">
                <label>What did you buy?</label>
                <input type="text" id="item" placeholder="2 scoops from Jeni’s…" required />
            </div>

            <div class="form-group">
                <label>Store name</label>
                <input type="text" id="store" placeholder="Store or restaurant" required />
            </div>

            <div class="form-group">
                <label>Dropoff location</label>
                <textarea id="dropoff" placeholder="Exact spot or address near the Beltline" required></textarea>
            </div>

            <div class="form-group">
                <label>Item value (max $50 for new riders)</label>
                <input type="number" id="value" min="1" max="50" required />
            </div>

            <div class="form-group">
                <label>Item weight (lbs)</label>
                <input type="number" id="weight" min="1" max="50" required />
            </div>

            <div class="form-group">
                <label>Tip Your Rider (optional)</label>
                <select id="tipPre">
                    <option value="0">$0</option>
                    <option value="2">$2</option>
                    <option value="5">$5</option>
                    <option value="10">$10</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="form-group" id="customTipWrapper" style="display:none;">
                <label>Custom Tip Amount</label>
                <input type="number" id="tipCustom" min="1" />
            </div>

            <p class="form-note" style="color:#fff;">
                After submitting, you’ll upload your receipt and complete payment via PayPal.
            </p>

            <button class="primary-btn" type="submit">Continue</button>
        </form>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
