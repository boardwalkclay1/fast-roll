<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — The Fast Roll</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/Fast-logo.png" />

    <!-- Social Preview -->
    <meta property="og:title" content="Create Your Fast Roll Account" />
    <meta property="og:image" content="/img/fast-index.jpg" />
    <meta property="og:description" content="Create your account to order Beltline deliveries instantly." />

    <link rel="stylesheet" href="/css/style.css" />

    <style>
        /* BLUE BACKGROUND */
        body {
            background: #0d1b3d;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* SCOOTER LOGO */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("/img/fast-scooter-logo.jpg");
            background-repeat: no-repeat;
            background-size: 160%;
            background-position: center -10%;
            opacity: 0.28;
            z-index: -1;
            pointer-events: none;
        }

        /* FORM WRAPPER */
        .form-wrapper {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 32px;
            border-radius: 14px;
            max-width: 520px;
            margin: 100px auto;
            color: #fff;
        }

        .form-wrapper h1,
        .form-wrapper p,
        label {
            color: #fff;
        }

        input {
            background: rgba(255, 255, 255, 0.85);
            border: none;
            padding: 10px;
            border-radius: 8px;
        }

        .primary-btn {
            background: #ffcc00;
            color: #000;
            font-weight: bold;
        }

        nav.nav {
            background: transparent;
            color: #fff;
        }

        nav.nav .logo {
            color: #fff;
            font-weight: bold;
        }

        nav.nav a {
            color: #ffcc00;
        }

        /* SCOOT MASCOT */
        .corner-photo {
            position: fixed;
            bottom: 18px;
            right: 18px;
            width: 200px;
            opacity: 0.9;
            pointer-events: auto;
            z-index: 9998;
            transition: transform 0.25s ease;
            cursor: pointer;
        }

        .mascot-bubble {
            animation: bubbleFade 0.3s ease;
        }

        @keyframes bubbleFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav class="nav">
        <div class="logo">THE FAST ROLL</div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/pages/client/signup.html">Sign Up</a>
        </div>
    </nav>

    <!-- SIGNUP FORM -->
    <main class="form-wrapper">
        <h1>Create Your Account</h1>
        <p>Sign up to start ordering Beltline deliveries instantly.</p>

        <form id="clientSignupForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" placeholder="Your full name" required />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input id="phone" type="tel" placeholder="(555) 555‑5555" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Create a password" required />
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input id="confirm" type="password" placeholder="Re‑enter password" required />
            </div>

            <div class="form-group">
                <label style="display:flex; align-items:center; gap:10px;">
                    <input id="terms" type="checkbox" required />
                    I agree to The Fast Roll terms & policies.
                </label>
            </div>

            <div class="form-actions">
                <button class="primary-btn" type="submit">Create Account</button>
            </div>

        </form>
    </main>

    <footer>
        <p>© 2026 The Fast Roll — Built for the Atlanta Beltline</p>
    </footer>

    <!-- SCOOT MASCOT -->
    <img src="/img/fast-board-transparent.jpg" class="corner-photo" alt="Scoot Mascot" />

    <script src="/js/app.js"></script>
    <script src="/js/mascot.js"></script>
</body>
</html>
